services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: garage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garage}
      POSTGRES_DB: garage
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # solo per sviluppo locale e backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garage -d garage"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://garage:${POSTGRES_PASSWORD:-garage}@db:5432/garage
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"

volumes:
  pgdata:
